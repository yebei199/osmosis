[[ac]]
id = "AC-6"
kind = "regression"
entry = "每 testcase 新账号/私有数据库、三客户端私有 namespace/音频/状态/端口；启动前静音、结束清理；独占 guardian IPC + Linux 子收割器/pidfd；实际嵌套 pytest 超时、TERM/INT、部分初始化失败、leader 先退出与异域进程对照"
