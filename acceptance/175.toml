tests = ["test_remote::test_core_pick[list]", "test_remote::test_core_pick[wall]", "test_remote::test_recover_invalid[queue-direct-playing]", "test_remote::test_recover_invalid[queue-direct-empty]", "test_remote::test_recover_invalid[queue-recovered-playing]", "test_remote::test_recover_invalid[queue-recovered-empty]", "test_remote::test_recover_invalid[revision-direct-playing]", "test_remote::test_recover_invalid[revision-direct-empty]", "test_remote::test_recover_invalid[revision-recovered-playing]", "test_remote::test_recover_invalid[revision-recovered-empty]", "test_remote::test_recover_invalid[entry-direct-playing]", "test_remote::test_recover_invalid[entry-direct-empty]", "test_remote::test_recover_invalid[entry-recovered-playing]", "test_remote::test_recover_invalid[entry-recovered-empty]", "test_remote::test_radio_publication_preserves_group_reference", "test_remote::test_last_output_reconnect", "test_remote::test_one_of_two_outputs_reconnect", "test_remote::test_server_restart", "test_lifecycle::test_leader_exit_reaps_detached_child[success]", "test_lifecycle::test_leader_exit_reaps_detached_child[failure]", "test_lifecycle::test_nested_pytest_timeout_cleans_world", "test_lifecycle::test_outer_cancel_cleans_descendants[term]", "test_lifecycle::test_outer_cancel_cleans_descendants[int]", "test_lifecycle::test_partial_initialization_cleans_registered_resource", "test_lifecycle::test_cleanup_preserves_unrelated_process"]
