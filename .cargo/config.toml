# 显式关掉 rustc 包装器:空串覆盖任何上层(全局 ~/.cargo/config.toml)设的
# rustc-wrapper。曾被全局 sccache 反复坑过——它依赖 nix-shell 的易失 TMPDIR 和
# 写死的 store 路径,一被清理就整个编译爆炸,且命中率为 0 毫无收益。本项目一律不走它。
# ponytail: 环境变量 RUSTC_WRAPPER 优先级高于本文件;真要临时开就在命令行显式设。
[build]
rustc-wrapper = ""

[alias]
# 构建逻辑写在 xtask/ 里,不是 shell 脚本。用法:`cargo xtask android`
# 注意 xtask 不负责准备工具链 —— Android SDK/NDK 仍由 Android.nix 或
# docker/Dockerfile 提供。见 docs/adr/0004。
xtask = "run --package xtask --quiet --"
