plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.slintstudy'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.slintstudy"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // ABIs are controlled by which jniLibs cargo-ndk produced; this
        // filter just guards against stray folders.
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters = (project.findProperty('studyAbis') ?: 'arm64-v8a,armeabi-v7a,x86_64').split(',')
        }
    }

    buildTypes {
        debug {
            // Rust is compiled by cargo-ndk before Gradle runs; the "debug" APK
            // packages release-profile .so files (a debug Slint+Skia build is
            // huge). Signed with AGP's auto-generated debug keystore.
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // libslint_study.so (+ libc++_shared.so) are placed in
    // src/main/jniLibs/<abi>/ by scripts/build-apk.sh via cargo-ndk.
}

dependencies {
    // none — plain Android framework APIs only
}
