name: Release

on:
  # 第一个 tag 是 v0.1.0,与 Cargo.toml 的 workspace version 对齐。
  push:
    tags:
      - 'v*'
  # 不打 tag 也能把构建这半跑一遍 —— release job 的 if 挡住了它,
  # 这条路径只产出 artifact,不建 GitHub Release。
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# 默认的 GITHUB_TOKEN 是只读的,没有这条 `gh release create` 会失败,
# 报出来的错看着像认证问题、不像配置问题。
permissions:
  contents: write

jobs:
  build:
    name: build
    # ubuntu-22.04 这个 label 从 2026-09-17 起进入弃用 brownout(到 2027-04-17
    # 下线,见 actions/runner-images#14254),固定用它会在弃用窗口里被故意判失败。
    # 第一版换成了裸 `container: ubuntu:22.04` 想让 glibc 基线不跟着镜像生命周期
    # 走,但跳过头了:
    # - glibc 2.39(24.04)≤ 2.42(消费方 NixOS)仍然满足约束,余量还在,不需要
    #   多退一版去够 2.35。
    # - Cargo.lock 里 skia-bindings 0.99.0 没开 build-from-source,正常靠下载
    #   预编译库;一旦拿不到会退回 bindgen,那需要 clang + python3。托管镜像自带,
    #   裸 ubuntu:22.04 两个都没有——「裸容器缺某个东西」这一整类首跑失败,换回
    #   托管镜像就整类消失。
    # - apt 依赖表抄的是 ci.yml test job 那张、已经在托管 ubuntu runner 上编过
    #   app-desktop(含 skia)的表;换成裸容器,这份「已验证」的出处就对不上了。
    # 代价是基线重新跟着镜像生命周期走,认了——24.04 退役还早,到时候也只是换一个
    # label,和这次的动作一样;弃用公告给的迁移路径本来就是 ubuntu-24.04。
    runs-on: ubuntu-24.04
    # 空缓存的 --release 全量构建要编 992 个 crate,含 skia 与 bevy;ci.yml 那
    # 37 分钟是靠 opt-level=0 按下来的,release 这边按不掉,60 分钟不够留余量。
    timeout-minutes: 90
    steps:
      # apt 依赖表逐字照抄 ci.yml test job:libfontconfig1-dev 是 femtovg 后端
      # 链接期要的,libasound2-dev 是 cpal→alsa,libopus-dev 是 syncplay 的 C
      # 绑定,protobuf-compiler 是 server/build.rs 的 codegen,dbus 是 MPRIS。
      # 这次只编 app-desktop,若某一项实际编译时发现根本用不上,再删。
      - name: 安装 native 依赖
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libasound2-dev libopus-dev protobuf-compiler dbus

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # OSMOSIS_API_BASE 是 crates/api 的 option_env!,编译期烘进二进制;
      # 不设它默认回退 127.0.0.1:3000,发出去的包连不上线上后端(#90)。
      # 地址与 justfile 的 api_base 默认值一字不差。
      #
      # --features mcp + SLINT_EMIT_DEBUG_INFO=1:开启内嵌 MCP server,让 AI
      # 助手能连上装机包读元素树、截图、模拟点击。两者缺一不可、代价与安全
      # 边界见 apps/desktop/Cargo.toml 的 [features] 注释,这里不重复。
      - run: cargo build --release -p app-desktop --features mcp
        env:
          OSMOSIS_API_BASE: https://music.cryptorust.uk
          SLINT_EMIT_DEBUG_INFO: "1"

      # option_env! 是编译期常量,上一步漏设环境变量时构建照样成功,只有
      # 产物烘错了地址——这类失败不会在构建阶段报错,必须另开一道门去查
      # 产物本身。
      - name: 校验产物烘的是线上地址
        run: |
          online_count=$(grep -a -c 'https://music.cryptorust.uk' target/release/osmosis-desktop || true)
          local_count=$(grep -a -c 'http://127.0.0.1:3000' target/release/osmosis-desktop || true)
          echo "online_count=$online_count local_count=$local_count"
          if [ "$online_count" -lt 1 ] || [ "$local_count" -ne 0 ]; then
            echo "产物烘的地址不对:期望线上地址 >=1、本机地址 =0" >&2
            exit 1
          fi

      # mcp feature 是否真的编进去了,不能只看构建没报错——上一条校验步的教训
      # 同样适用于它。字符串取自 slint mcp_server 的 run_server(它启动时打印
      # 的监听行),只有编了 slint/mcp 才会存在这段代码。
      - name: 校验产物编进了 MCP server
        run: |
          mcp_count=$(grep -a -c 'Slint MCP server listening on http://' target/release/osmosis-desktop || true)
          echo "mcp_count=$mcp_count"
          if [ "$mcp_count" -lt 1 ]; then
            echo "产物没有编进 MCP server:--features mcp 没生效" >&2
            exit 1
          fi

      # 前两条校验步只证明 mcp feature 编进去了,证明不了元素调试信息也编
      # 进去了(#99):build.rs 若没接上 SLINT_EMIT_DEBUG_INFO,MCP 端口照样
      # 通、get_element_tree 却只回一个空壳根。"MainWindow" 只有嵌了调试信息
      # 才会作为元素类型名出现在产物字符串里(crates/ui/slint/app.slint 的
      # 根组件名),没嵌时这个类型名不会被编译器写进二进制。
      - name: 校验产物嵌了元素调试信息
        run: |
          debug_info_count=$(grep -a -c 'MainWindow' target/release/osmosis-desktop || true)
          echo "debug_info_count=$debug_info_count"
          if [ "$debug_info_count" -lt 1 ]; then
            echo "产物没有嵌元素调试信息:SLINT_EMIT_DEBUG_INFO 没生效" >&2
            exit 1
          fi

      # [[bin]] 声明的产物名是 osmosis-desktop(见 apps/desktop/Cargo.toml),
      # 落在 target/release/osmosis-desktop;发布名加上 target 三元组前缀。
      # 桌面入口与图标(assets/io.github.osmosis.desktop、.svg)与平台无关,
      # 裸名原样带进 dist,不加三元组前缀;必须先 cp 齐三个文件再 cd dist,
      # 否则 cd 之后 cp 就找不到 assets/ 里的源了。
      - name: 打包产物与校验和
        run: |
          mkdir -p dist
          cp target/release/osmosis-desktop dist/osmosis-desktop-x86_64-linux
          cp assets/io.github.osmosis.desktop assets/io.github.osmosis.svg dist/
          cd dist && sha256sum osmosis-desktop-x86_64-linux io.github.osmosis.desktop io.github.osmosis.svg > sha256sums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: osmosis-desktop-x86_64-linux
          path: dist/*

  release:
    name: release
    needs: build
    # 只判 ref 不够:对着一个 tag ref 手动发 workflow_dispatch 也会匹配
    # startsWith(ref, 'refs/tags/'),而 issue 明写 workflow_dispatch 那条路径
    # 只能 upload artifact、不许 create release。event_name 把这种误用也挡住。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: osmosis-desktop-x86_64-linux
          path: dist

      # gh 默认从本地 git remote 认仓库;这个 job 没有 actions/checkout,工作
      # 目录不是 git 仓库,所以要显式给 GH_REPO。GITHUB_REPOSITORY 不顶用——
      # gh 不读它,只认本地 git remote 或 GH_REPO,r1 那次探针在两者都缺时
      # 报的就是 `fatal: not a git repository`。
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/osmosis-desktop-x86_64-linux dist/io.github.osmosis.desktop \
            dist/io.github.osmosis.svg dist/sha256sums.txt \
            --title "${{ github.ref_name }}"
