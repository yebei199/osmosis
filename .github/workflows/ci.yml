name: CI

on:
  # 只在 PR 上跑。dev 的日常 push 不触发 —— 那里的验证靠本地 `just ci`。
  #
  # master 的 push 也不触发,尽管进主干正是最该验证的时刻:GitHub 给 `pull_request`
  # 跑的本来就是**合并后**的结果(base 与 head 的临时 merge ref),PR 绿了就等于合进去
  # 绿了。合并后再跑一遍是同一件事算第二次,而这个 workflow 一轮三十多分钟。
  # 代价是直接推 master(热修、网页端改文件)完全没有 CI —— 那种改动请走 PR。
  pull_request:
  # 想在某个分支上手动跑一次时用。
  workflow_dispatch:

# 这里刻意不设 RUSTFLAGS。它进 cargo 的构建指纹,本地 `just ci` 与 `just desktop-dev`
# 因此会各自维护一套完整的依赖树产物。CI 是干净 checkout 感觉不到,但 justfile 里那几条
# 命令要求与本文件逐字相同,所以两边一起撤。warning 由下面 clippy 的 `-- -D warnings`
# 拦截 —— 那是传给最终 crate 的参数,不进依赖指纹。
env:
  CARGO_TERM_COLOR: always

jobs:
  # test 与 clippy 是**两个** job,不是一个 job 里的四条命令。clippy 用的是另一个
  # rustc driver,产物与 cargo test 不共享指纹,串起来等于把整棵依赖树编两遍并把两次
  # 时间相加(实测 22m36s + 8m40s)。拆开之后墙钟取两者的较大值。上游 Slint 也是这么
  # 分的:`build_and_test` 与 `clippy` 各自独立(它们的 `.github/workflows/ci.yaml`)。
  #
  # 两个 job 的准备步骤因此重复一遍 —— GitHub Actions 没有 YAML 锚点,复制是唯一选择。
  # 缓存不必共用:两者产物本来就不同,`Swatinem/rust-cache` 默认按 job 名分键,正合适。

  # 桌面链路:workspace 的 default-members,外加 server 与 xtask。
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # femtovg 后端在构建期通过 pkg-config 链接 fontconfig;
      # audio 走 cpal→alsa,syncplay 走 libopus 的 C 绑定。
      # protoc 是 server/build.rs 的 codegen 用的 —— tonic-prost-build 不自带,
      # 要的是系统里那一个。
      - name: 安装 native 依赖
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libasound2-dev libopus-dev protobuf-compiler

      # 每条 cargo 都带 `--config profile.dev.package."*".opt-level=0`,把根 Cargo.toml
      # 里那条依赖优化按掉。那条存在的理由是本地 3D 的帧率(见 Cargo.toml 的注释),
      # 而 CI 一帧都不画 —— 实测把依赖树按 -O3 编掉了三十多分钟,买到的东西这里用不上。
      # 用命令行 `--config` 而不是往 .cargo/config.toml 里写:它的优先级高于 manifest,
      # 语义明确,不依赖 config 与 manifest 谁覆盖谁。
      #
      # 这些都不在 default-members 里,单独点名 —— 裸 `cargo test` 只编不测。
      - run: cargo test --config 'profile.dev.package."*".opt-level=0'
      - run: cargo test --config 'profile.dev.package."*".opt-level=0' -p audio -p syncplay -p server -p xtask

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # clippy 同样要编译整棵树,native 依赖与 test job 一致。
      - name: 安装 native 依赖
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libasound2-dev libopus-dev protobuf-compiler

      - run: cargo clippy --config 'profile.dev.package."*".opt-level=0' --all-targets -- -D warnings
      - run: cargo clippy --config 'profile.dev.package."*".opt-level=0' --all-targets -p audio -p syncplay -p server -p xtask -- -D warnings

  # 本地跑不动的端,至少保证它们**能编译** —— 否则 app-core/api 会悄悄长出
  # 这些 target 编不过的假设,等真要做 iOS 时才发现。见 issue #1。
  #
  # aarch64-apple-ios 暂时不在此列。它得在 macOS runner 上跑 —— 依赖树里带 C 代码的
  # crate(ring、blake3 等)的 build.rs 走 cc-rs,对 Apple target 会去找 xcrun,
  # Linux runner 给不了 —— 而换上 macos-latest 之后仍有别的问题没查。iOS 这个端本来
  # 也还没有人在真机上跑过,先摘掉,等有 Mac 了再连同工具链一起补。
  # `架构边界` 里的 web_ios_free_of_3d 仍然覆盖 app-ios 的依赖形状。
  cross-check:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            package: app-android
          - target: wasm32-unknown-unknown
            package: app-web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # Slint 的 android 后端在 build.rs 里编译一个 Java helper,因此连
      # `cargo check` 都需要 platform jar。ubuntu-latest 镜像自带 Android SDK。
      #
      # NDK 的 clang 还得显式指出来:依赖树里 blake3 这类带 C 代码的 crate 由
      # cc-rs 驱动编译,而 cc-rs 找的是 `aarch64-linux-android-clang` —— 那个不带
      # API level 的名字在 r23 之后的 NDK 里根本不存在,得指到 `…android26-clang`。
      # 26 与 xtask 的 MIN_SDK、gradle 的 minSdk 是同一个数。
      - name: 确认 Android SDK 与 NDK 就位
        if: matrix.target == 'aarch64-linux-android'
        run: |
          test -n "$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          {
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"

      # 同样按掉依赖优化,理由见 test job。
      - run: cargo check --config 'profile.dev.package."*".opt-level=0' -p ${{ matrix.package }} --target ${{ matrix.target }}

  # 架构约束的可执行形式。这些断言一旦失守,重构就白做了。
  #
  # 检查逻辑住在 xtask 里,不是这个 yaml 里的 bash —— 否则本地永远没法在推送前
  # 跑到同一份代码。`just ci` 调的是同一个命令。见 docs/adr/0004。
  boundaries:
    name: 架构边界
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask boundaries
