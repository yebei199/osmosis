<!DOCTYPE html>
<!--
  宿主页面。slint 的 winit 后端在 wasm 上会去找 id 为 `canvas` 的元素,
  名字不能改。
-->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>slint_study (web)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1e1e1e; overflow: hidden; }

      /* slint 会给 canvas 写 inline style,把它钉在内容的 preferred size 上
         (一个贴在左上角的小画布)。这里用样式表里的 !important 压过去,让它铺满视口 ——
         winit 的 ResizeObserver 会把新尺寸回灌给 slint,触发一次真正的重排,而不是拉伸像素。

         !important 必须写在样式表里:它只能压过 inline 声明,若写进 inline,
         winit 的 style.setProperty 会把声明连同优先级一起覆盖掉。

         已知缺陷:devicePixelRatio ≠ 1 时(HiDPI / 缩放屏),布局放大 dpr 倍并被裁切、
         渲染模糊、指针坐标也偏移 dpr 倍(点击要落在视觉位置的 1/dpr 处才命中)。
         三者是同一个根因:slint 的 wasm 后端把 canvas 的 CSS 像素当成物理像素,
         每轮 resize 再除一次 dpr。这条 CSS 不引入该缺陷,也不加重它 ——
         去掉它,HiDPI 上同样是裁切、模糊、指针偏移。 */
      canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        min-width: 0 !important;
        min-height: 0 !important;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script type="module">
      // wasm-bindgen 以 crate 名(下划线形式)命名产物。
      import init from "./app_web.js";
      init();
    </script>
  </body>
</html>
