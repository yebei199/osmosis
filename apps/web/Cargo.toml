[package]
name = "app-web"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Web 平台入口:编译为 wasm,由浏览器加载"

[lib]
crate-type = ["cdylib"]

[dependencies]
ui.workspace = true
wasm-bindgen = "0.2"
# 没有它,wasm 里的 panic 在控制台只是一句 `RuntimeError: unreachable`,消息全丢。
console_error_panic_hook = "0.1"
# 把 log:: 宏接到浏览器控制台。desktop 用 env_logger、android 用 android_logger。
console_log = "1"
# wasm 上 winit 走 canvas,femtovg 走 WebGL。
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg"] }
