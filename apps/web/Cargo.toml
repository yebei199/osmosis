[package]
name = "app-web"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Web 平台入口:编译为 wasm,由浏览器加载"

[lib]
crate-type = ["cdylib"]

[dependencies]
ui.workspace = true
render3d = { workspace = true, optional = true }
wasm-bindgen = "0.2"
# 没有它,wasm 里的 panic 在控制台只是一句 `RuntimeError: unreachable`,消息全丢。
console_error_panic_hook = "0.1"
# 把 log:: 宏接到浏览器控制台。desktop 用 env_logger、android 用 android_logger,
# web 缺了这一环,render3d 的纹理诊断就成了哑的(见 Scene::render_frame)。
console_log = "1"
# async 版 #[wasm_bindgen(start)] 的展开代码要它把 future 挂到 JS 微任务队列。
wasm-bindgen-futures = { version = "0.4", optional = true }
# 只用来读 window.location.search(见 query_value)。slint 本来就把它编进来了,
# 显式列出不额外增加构建成本。
web-sys = { version = "0.3", features = ["Location"] }
# wasm 上 winit 走 canvas,femtovg 走 WebGL。
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg"] }

[features]
# 换用 femtovg-wgpu 渲染器(slint#11580):先探测 WebGPU,浏览器不支持则自动回退
# wgpu 的 WebGL 后端。编入即生效 —— winit 后端选默认渲染器时 wgpu 版优先级高于 GL 版。
# 用法:`just web-dev wgpu`。这是 web 端 bevy 纹理共享的前置(见 docs/adr/0005)。
wgpu = ["slint/renderer-femtovg-wgpu"]
# 帧率问题的最小复现:纯 Slint + femtovg-wgpu,不含 3D 与本项目界面(见 lib.rs 的 repro 入口)。
# 用法:`just web-dev repro`。默认关闭 —— 打开时它会顶掉正常入口。
repro = ["wgpu"]
# 嵌入 bevy 3D:拉进 render3d,共享 wgpu device 走纹理共享(同 desktop/android 的
# 同名 feature)。仅 WebGPU —— render3d 的 Manual 路径不做 WebGL 降级。
# 用法:`just web-dev bevy-3d`。
bevy-3d = [
    "dep:render3d",
    "dep:wasm-bindgen-futures",
    "wgpu",
    "slint/unstable-wgpu-29",
    "ui/debug-fps",
]
