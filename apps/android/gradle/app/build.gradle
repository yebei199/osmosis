plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.osmosis'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.osmosis"
        // 29(Android 10)而不是 26:下载要把文件写进系统的公共音乐目录,
        // 而 MediaStore 的 RELATIVE_PATH 与 IS_PENDING 是 API 29 才有的。
        // 退回旧路径要 WRITE_EXTERNAL_STORAGE,那是个用户看得见、也该拒绝的权限,
        // 换来的只是多支持两个 2017 年的系统版本。
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // ABIs are controlled by which jniLibs cargo-ndk produced; this
        // filter just guards against stray folders. `cargo xtask android`
        // always passes -PstudyAbis, so the fallback only applies to a bare
        // gradle invocation. armeabi-v7a is deliberately absent from both
        // (issue #47): skia-bindings ships no armv7 prebuilt.
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters = (project.findProperty('studyAbis') ?: 'arm64-v8a,x86_64').split(',')
        }
    }

    buildTypes {
        debug {
            // Rust is compiled by cargo-ndk before Gradle runs; the "debug" APK
            // packages release-profile .so files (a debug Slint+Skia build is
            // huge). Signed with AGP's auto-generated debug keystore.
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // libosmosis.so (+ libc++_shared.so) are placed in
    // src/main/jniLibs/<abi>/ by `cargo xtask android` via cargo-ndk.
}

dependencies {
    // none — plain Android framework APIs only
}
