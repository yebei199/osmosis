[package]
name = "synctest"
version = "0.1.0"
edition = "2024"
publish = false
description = "#137 ②:两端各自出声、共享时间轴的最小原型,配合录音测真实偏差"

# 独立实验,不进主 workspace(见 ../README.md)。
[workspace]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
