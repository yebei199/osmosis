<?xml version="1.0" encoding="UTF-8"?>
<!--
    Osmosis 的图标源。三端派生的都是这一份:

    - 桌面:本文件直接装到 hicolor/scalable/apps(见 justfile 的 desktop-install)
    - 安卓:apps/android/.../res 下的 ic_launcher_foreground / ic_launcher_background
    - 通知栏小图标:同一批点,去掉颜色只留 alpha

    形状就是名字的字面意思:一条竖线当半透膜,左侧密而小、右侧疏而大。
    纯几何,缩到 48px 仍认得出;彩色细节全在色板上,单色版把它们抹掉也不塌。

    坐标网格是 24×24,与安卓那两份保持一致 —— 改一处形状,三处一起改。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="256" height="256">
  <rect width="24" height="24" rx="5.4" fill="#191e32"/>
  <!-- 膜:半透明的一道,不能比点更抢眼 -->
  <path d="M11.4,3H12.6V21H11.4Z" fill="#e8ecf5" opacity="0.5"/>
  <!-- 渗过去之前:密而小 -->
  <path fill="#d9a86c" d="M5.1,7a0.9,0.9 0 1,0 1.8,0a0.9,0.9 0 1,0 -1.8,0ZM7.6,6a0.9,0.9 0 1,0 1.8,0a0.9,0.9 0 1,0 -1.8,0ZM6.1,10a0.9,0.9 0 1,0 1.8,0a0.9,0.9 0 1,0 -1.8,0ZM8.6,10.5a0.9,0.9 0 1,0 1.8,0a0.9,0.9 0 1,0 -1.8,0ZM5.6,14a0.9,0.9 0 1,0 1.8,0a0.9,0.9 0 1,0 -1.8,0ZM8.1,15.5a0.9,0.9 0 1,0 1.8,0a0.9,0.9 0 1,0 -1.8,0ZM6.6,18a0.9,0.9 0 1,0 1.8,0a0.9,0.9 0 1,0 -1.8,0Z"/>
  <!-- 渗过去之后:疏而大 -->
  <path fill="#f0c48a" d="M14.8,8a1.7,1.7 0 1,0 3.4,0a1.7,1.7 0 1,0 -3.4,0ZM17.3,13a1.7,1.7 0 1,0 3.4,0a1.7,1.7 0 1,0 -3.4,0ZM14.3,17.5a1.7,1.7 0 1,0 3.4,0a1.7,1.7 0 1,0 -3.4,0Z"/>
</svg>
