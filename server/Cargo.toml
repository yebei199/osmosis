[package]
name = "server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "后端:与客户端共享 contract,并把 bang-dream 的 gRPC 翻译成 HTTP/JSON"

[dependencies]
contract.workspace = true
serde.workspace = true
axum = { version = "0.8", features = ["ws"] }
# time 有两处要:信令的 Hello 超时与心跳(signaling.rs),以及 routes::netease
# 给上游那条扫码流的第一条消息套的上限。
# process 与 io-util 是 /download 那条转码路要的:起 ffmpeg,并把上游字节喂进它的 stdin。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
tower-http = { version = "0.6", features = ["cors"] }
# /download 要把平台那条临时直链的字节拉过来。版本与 crates/api 那份对齐,
# 依赖树里因此只有一份 reqwest。rustls 而不是系统 openssl:运行镜像是
# debian-slim 且不含任何 RUN,装不了 libssl。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# ffmpeg 的 stdout 是 AsyncRead,而响应体要的是一条 Stream —— ReaderStream 就是那层包装。
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
# gRPC 客户端一侧。生成代码由 build.rs 从 third_party/bang-dream 的 .proto 产出。
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
# WebSocket 的收发两端要拆开跑(见 signaling::serve),故需要 StreamExt/SinkExt。
futures-util = { version = "0.3", default-features = false }
# 信令走 JSON 文本帧。HTTP 那侧由 axum 的 Json 提取器负责,不必自己序列化;
# WebSocket 没有对应的提取器,消息体只能自己转。
serde_json = "1"
# 自家数据(账号、本地歌单、播放事件)的落盘。平台歌单不进这里,见 docs/adr/0016。
#
# `macros` 开着只为 `migrate!`(它把 migrations/ 编进二进制,不连库)。
# **不用 `query!`**:那个宏要在编译期连上数据库校验 SQL,会让 `cargo build`
# 依赖一个跑着的 Postgres,或者养一个 `.sqlx` 离线目录跟着每次改 SQL 更新。
# 一律用运行时的 `query_as` —— 代价是 SQL 写错要到测试才发现,
# 而这些 SQL 每一条都有测试盖着。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
# 密码哈希。argon2 是当前的推荐算法,自带盐与参数编码,不必自己拼格式。
argon2 = "0.5"
# 结构化日志。数据库错误、启动信息都走它 —— 之前那句 println! 一并换掉。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 会话 token 落库前先过一次哈希。token 是高熵随机串,不需要 argon2 那种慢哈希,
# sha256 足够 —— 目的只是让库泄露不等于会话被接管。
sha2 = "0.10"
# 限流。按账号/来源分桶的 GCRA,套在路由组上(见 gate::ratelimit)。
#
# 开着它的 `tracing`:拒绝时那一行 info 带着**被拒的键**(账号 id / IP),本仓自己
# 那行 warn 只拿得到欠了几秒(`error_handler` 见不到请求)。关掉的话 429 查不出是谁
# 在耗额度,2026-09-21 那次就是这么断的线(#113)。
tower_governor = { version = "0.8", default-features = false, features = ["axum", "tracing"] }
tower = { version = "0.5", default-features = false }
# `tower_governor` 的公开签名里带着 `governor::middleware::NoOpMiddleware`,
# 却没有把它再导出 —— 要给配置起一个类型别名就只能直接依赖 `governor`。
governor = { version = "0.10", default-features = false, features = ["std", "quanta"] }
# 听过的歌存进 RustFS(#126,见 `objects`)。只要它签名的那一半:HTTP 仍走上面
# 那份 reqwest,xml 与 full 两组特性管的是列桶、批删这些用不上的动作。
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto"] }

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
similar-asserts.workspace = true
# 信令测试要当**客户端**连自己的 WebSocket。axum 只提供服务端那一半,
# 客户端另找一个 —— tungstenite 是 axum 自己底下用的那套,协议实现一致。
tokio-tungstenite = "0.28"
# 路由测试要在进程内起一个假的 bang-dream。端口交给内核挑(:0),
# 而 `serve_with_incoming` 要的是一个 Stream —— 这个 crate 提供那层包装。
# 先绑再交出去,并行的测试因此撞不上,也不必猜一个空闲端口。
tokio-stream = { version = "0.1", features = ["net"] }
