[package]
name = "ui"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "界面的声明,以及界面与客户端领域之间的双向绑定"

[dependencies]
# ui 是组装点:它把 api 的请求函数注入 app-core,二者互不相识。
app-core.workspace = true
api.workspace = true
slint.workspace = true
# 帧耗时记账的输出口。各平台入口已各自装好 logger(env_logger / android_logger / console_log)。
log.workspace = true
# std::time::Instant 在 wasm32-unknown-unknown 上会 panic;web-time 同 API,
# wasm 下走 performance.now(),原生下就是 std 的再导出。已在依赖树里(bevy 用它)。
web-time = "1"

# 渲染后端由平台入口 crate(apps/*)追加到 slint 的 feature 上,这里不选。
[build-dependencies]
slint-build.workspace = true

# 只用来在测试里查子集字体的 cmap。slint 自己也依赖它,不引入新的下载。
[dev-dependencies]
ttf-parser = "0.25"

[features]
default = []
# 帧率计。数渲染通知里真实发生的帧,刻意不主动请求重绘 —— Slint 惰性渲染,空闲时
# 读数自然趴到 ~1,交互/动画才飙高,是诚实的即时帧率,不额外耗电(见 src/lib.rs 的 fps 模块)。
# 平时不开只为省掉这点开销与那行 UI:`cargo run -p app-desktop --features ui/debug-fps`
debug-fps = []
