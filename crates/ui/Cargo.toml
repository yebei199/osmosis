[package]
name = "ui"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "界面的声明,以及界面与客户端领域之间的双向绑定"

[dependencies]
# ui 是组装点:它把 api 的请求函数注入 app-core,二者互不相识。
app-core.workspace = true
api.workspace = true
slint.workspace = true

# 渲染后端由平台入口 crate(apps/*)追加到 slint 的 feature 上,这里不选。
[build-dependencies]
slint-build.workspace = true

# 只用来在测试里查子集字体的 cmap。slint 自己也依赖它,不引入新的下载。
[dev-dependencies]
ttf-parser = "0.25"

[features]
default = []
# 帧率计。开启后每帧主动请求重绘,渲染循环会一直满转 —— 移动端上白耗电,
# 所以只在需要观察帧率时打开:`cargo run -p app-desktop --features ui/debug-fps`
debug-fps = []
