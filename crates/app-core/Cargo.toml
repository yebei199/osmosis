version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "客户端领域:应用持有的状态,以及改变状态的规则"

# 只依赖 contract。这个 crate 是纯规则层:不知道 slint、不知道 HTTP,
# 也不碰时钟、文件系统和线程。没有隐式的时间源和 IO,同一份输入永远得出
