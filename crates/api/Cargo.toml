[package]
name = "api"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "把领域意图翻译成一次网络往返,并吸收各端运行时能力的差异"

[dependencies]
contract.workspace = true
serde.workspace = true
# 会话落盘失败只记一笔日志:登录本身已经成功了,存不下来不该让它连带失败。
log.workspace = true
# 服务端的错误响应体要按 ErrorDto 解出来,才能把 code 交给上层分支。
serde_json = "1"
# 不开 default-features 只为挡掉 native-tls(openssl)。代理是另一回事:
# system-proxy 那个特性只管 macOS 和 Windows 的系统设置,HTTPS_PROXY 这类
# 环境变量 reqwest 无条件读 —— 要直连得在建 Client 时显式 `.no_proxy()`,
# 见 src/platform/native.rs。
# rustls-tls 用 ring + 内置 webpki 根证书:安卓上不需要任何平台胶水,
# 集群的 Let's Encrypt 证书(*.k3s.cryptorust.uk)正好在根里。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# wasm 上没有线程,也没有 tokio runtime;fetch 由浏览器驱动。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
# 列表的本地缓存(#123)。bundled:安卓上没有系统 sqlite 可链。版本跟着 lock 里
# sqlx 那份 libsqlite3-sys(0.30)走 —— 两个版本同时出现会撞 `links = "sqlite3"`。
rusqlite = { version = "0.32", features = ["bundled"] }
# 应用内升级(src/update.rs):版本比较要按 semver(0.1.9 < 0.1.10、rc 早于正式版),
# APK 要按 Release 里的 sha256 核对。两样都已在依赖树里,不新增下载。
semver = "1"
sha2 = "0.10"

# 网页上的登录态存在 localStorage 里 —— 不存的话每次刷新都要重登。
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[dev-dependencies]
similar-asserts.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
