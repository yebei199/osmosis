[package]
name = "api"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "把领域意图翻译成一次网络往返,并吸收各端运行时能力的差异"

[dependencies]
contract.workspace = true
serde.workspace = true
# 会话落盘失败只记一笔日志:登录本身已经成功了,存不下来不该让它连带失败。
log.workspace = true
# 服务端的错误响应体要按 ErrorDto 解出来,才能把 code 交给上层分支。
serde_json = "1"
# 不开 default-features:那会拉进 native-tls(openssl)和 system-proxy(读
# HTTPS_PROXY 环境变量 —— 集群地址在 tailnet 里,走本机代理必挂)。
# rustls-tls 用 ring + 内置 webpki 根证书:安卓上不需要任何平台胶水,
# 集群的 Let's Encrypt 证书(*.k3s.cryptorust.uk)正好在根里。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# wasm 上没有线程,也没有 tokio runtime;fetch 由浏览器驱动。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

# 网页上的登录态存在 localStorage 里 —— 不存的话每次刷新都要重登。
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
