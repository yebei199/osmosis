[package]
name = "syncplay"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "设备之间的信令客户端:同账号名册与遥控器模式"

[dependencies]
contract.workspace = true
serde.workspace = true
serde_json = "1"
log.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
# 不开 native-tls(openssl):理由与 `crates/api/Cargo.toml` 一致 —— rustls-tls
# 用 ring + 内置 webpki 根证书,安卓上不需要平台胶水。同一条 TLS 栈,一份信任。
tokio-tungstenite = { version = "0.28", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
similar-asserts.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# 测试要在进程里起一个真的信令服务端,才能让两端真的握上手。
server = { path = "../../server" }
axum = { version = "0.8", features = ["ws"] }
