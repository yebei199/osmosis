[package]
name = "syncplay"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "同播能力层:信令客户端与设备之间的 WebRTC 连接"

[dependencies]
contract.workspace = true
serde.workspace = true
serde_json = "1"
webrtc.workspace = true
# 编解码与采样的定义都在 audio —— 传输层不自己造一套。
audio.workspace = true
rodio.workspace = true
bytes = "1"
# 主控那条泵跑在普通线程上,要在其中阻塞等一个 async 的 write_sample。
# 不用 tokio 的 block_on:那要求当前线程属于某个 runtime,而它不属于。
futures-executor = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
similar-asserts.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# 测试要在进程里起一个真的信令服务端,才能让两端真的握上手。
server = { path = "../../server" }
axum = { version = "0.8", features = ["ws"] }
# webrtc 的 Sample.data 是 bytes::Bytes,构造它得直接引这个 crate。
bytes = "1"
