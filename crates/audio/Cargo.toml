[package]
name = "audio"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "音频播放能力层:把一条直链变成声音,并吸收各端音频后端的差异"

[dependencies]
rodio.workspace = true
stream-download.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
rustfft = "6"
# 只用来记流的失联与重连。各平台入口已各自装好 logger。
log.workspace = true
# 自定义流(见 src/range_stream.rs)要实现 Stream,以及转发 Bytes。
# 两者都已在依赖树里(stream-download 自己就用),不新增下载。
futures-util = { version = "0.3", default-features = false }
bytes = "1"
# 给 stream-download 当 HTTP 客户端(见 src/stream_client.rs)。特性选择与
# crates/api 同一套理由:rustls-tls 是 ring + 内置 webpki 根,安卓零胶水;
# 不开 default-features 挡掉 native-tls;代理另见 src/stream_client.rs 的
# `.no_proxy()` —— 环境变量 reqwest 是无条件读的。"stream" 给
# bytes_stream 用 —— 边下边读靠它。
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
# 开流分段计时的连接器层要实现 tower 的 Layer / Service(见 src/open_timing.rs)。reqwest 自己就依赖
# 这两个，不新增下载。
tower-layer = "0.3"
tower-service = "0.3"

# 自己开声卡流(见 src/output):rodio 的设备把 cpal 回调里的时间戳丢了,而同步播放
# 要的正是它(#137 ⑤)。与 rodio 用的是同一个 cpal,不多一份。
cpal = "0.17"
# CLOCK_MONOTONIC 的原始读数:AAudio 的时间戳用的就是这个钟,`Instant` 不给出纪元。
libc = "0.2"

# 安卓直接用 NDK 的 AAudio:cpal 的 AAudio 后端给的两个时刻不是同一个钟(#137 ⑤ 调查)。
# 与 cpal 依赖的是同一个 ndk 0.9。minSdk 是 29,api-level-28 的接口都在。
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
# 查输出路由(扬声器/蓝牙/有线)要问 AudioManager(见 src/output/route.rs)。与 apps/android 同一份
# jni 0.22;JavaVM 与 Activity 从 android-activity 登记的 ndk-context 里取。
jni = "0.22"
ndk-context = "0.1"

[dev-dependencies]
similar-asserts.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }
# 联机测试用:自己打 axum 后端拿一条真实直链。不走 api crate ——
# 那会让 audio 依赖 api,把两个平行的能力层串成一条链。
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
