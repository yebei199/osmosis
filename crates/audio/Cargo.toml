[package]
name = "audio"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "音频播放能力层:把一条直链变成声音,并吸收各端音频后端的差异"

[dependencies]
rodio.workspace = true
stream-download.workspace = true
# 同播要把 PCM 重编码成 Opus。没有成熟的纯 Rust 编码器,这是 libopus 的绑定 ——
# devshell 里的 libopus 由 slint.nix 提供。
opus = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
rustfft = { version = "6", registry = "tuna" }

[dev-dependencies]
similar-asserts.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }
# 联机测试用:自己打 axum 后端拿一条真实直链。不走 api crate ——
# 那会让 audio 依赖 api,把两个平行的能力层串成一条链。
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
