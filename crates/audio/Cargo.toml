[package]
name = "audio"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "音频播放能力层:把一条直链变成声音,并吸收各端音频后端的差异"

[dependencies]
rodio.workspace = true
stream-download.workspace = true
# 同播要把 PCM 重编码成 Opus。没有成熟的纯 Rust 编码器,这是 libopus 的绑定 ——
# devshell 里的 libopus 由 slint.nix 提供。
opus = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
rustfft = "6"
# 只用来记流的失联与重连。各平台入口已各自装好 logger。
log.workspace = true
# 自定义流(见 src/range_stream.rs)要实现 Stream,以及转发 Bytes。
# 两者都已在依赖树里(stream-download 自己就用),不新增下载。
futures-util = { version = "0.3", default-features = false }
bytes = "1"
# 给 stream-download 当 HTTP 客户端(见 src/stream_client.rs)。特性选择与
# crates/api 同一套理由:rustls-tls 是 ring + 内置 webpki 根,安卓零胶水;
# 不开 default-features 挡掉 native-tls 和 system-proxy。"stream" 给
# bytes_stream 用 —— 边下边读靠它。
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }

[dev-dependencies]
similar-asserts.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }
# 联机测试用:自己打 axum 后端拿一条真实直链。不走 api crate ——
# 那会让 audio 依赖 api,把两个平行的能力层串成一条链。
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
