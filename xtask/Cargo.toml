[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "构建逻辑。经 .cargo/config.toml 的 alias 暴露为 `cargo xtask`"
publish = false

# 依赖刻意为空:xtask 要在任何一台刚 clone 的机器上立刻能跑。
[dependencies]

# dev-dependencies 不进 `cargo xtask` 的构建图,上面那条"零依赖"因此仍然成立:
# 只有 `cargo test -p xtask` 才会拉它。
[dev-dependencies]
similar-asserts.workspace = true
