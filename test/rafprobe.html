<meta charset="utf-8">
<title>rAF vs WebGPU canvas</title>
<style>
  body { font: 14px/1.6 monospace; background: #111; color: #eee; padding: 24px; }
  canvas { border: 1px solid #444; display: block; margin: 12px 0; }
  button { font: inherit; padding: 6px 14px; margin-right: 8px; }
  #out { white-space: pre; margin-top: 16px; }
</style>

<h3>rAF 速率:定位是哪项配置触发 Chrome 降频</h3>
<p>把 Slint 页与本页的差异逐项开进来,每档测 2 秒。Slint 页实测:backing 1605×1984、
CSS 1284×1587(dpr 1.25 缩放)、每帧 ~1ms JS、回调间隔中位 13.9ms(72Hz,144 的分频)。</p>

<button id="sweep">自动扫描全部档位</button>
<div id="stage"></div>
<div id="out">等待…</div>

<script type="module">
const out = document.getElementById('out');
const stage = document.getElementById('stage');
const log = (s) => { out.textContent += s + '\n'; };

let device = null;
async function initGpu() {
  if (device) return true;
  if (!navigator.gpu) { log('没有 WebGPU'); return false; }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) { log('requestAdapter null'); return false; }
  device = await adapter.requestDevice();
  return true;
}

// 一档:按配置建 canvas,rAF 循环 2 秒,每帧 clear+submit(可选),量回调间隔。
function runCase(cfg) {
  return new Promise((resolve) => {
    const c = document.createElement('canvas');
    c.width = cfg.w; c.height = cfg.h;
    if (cfg.cssW) { c.style.width = cfg.cssW + 'px'; c.style.height = cfg.cssH + 'px'; }
    stage.replaceChildren(c);
    const ctx = c.getContext('webgpu');
    ctx.configure({
      device,
      format: navigator.gpu.getPreferredCanvasFormat(),
      alphaMode: cfg.alpha,
    });
    const ds = [];
    let last = 0;
    const t0 = performance.now();
    (function loop(t) {
      if (last) ds.push(t - last);
      last = t;
      if (cfg.busyMs) { const e = performance.now() + cfg.busyMs; while (performance.now() < e); }
      if (cfg.present) {
        const enc = device.createCommandEncoder();
        const pass = enc.beginRenderPass({ colorAttachments: [{
          view: ctx.getCurrentTexture().createView(),
          clearValue: { r: 0.1, g: 0.15, b: 0.3, a: 1 }, loadOp: 'clear', storeOp: 'store',
        }]});
        pass.end();
        device.queue.submit([enc.finish()]);
      }
      if (performance.now() - t0 < 2000) requestAnimationFrame(loop);
      else {
        ds.sort((a, b) => a - b);
        const med = ds[ds.length >> 1], p90 = ds[Math.floor(ds.length * 0.9)];
        log(`${cfg.name.padEnd(30)} 中位 ${med.toFixed(1)}ms(${(1000 / med).toFixed(0)}Hz) p90 ${p90.toFixed(1)}`);
        ctx.unconfigure();
        resolve();
      }
    })(performance.now());
  });
}

// 差异逐项开进来。base 是上次实测 142Hz 的配置;slint-* 逐步逼近 Slint 页的真实形态。
const CASES = [
  { name: 'base(1485x984 premul)',      w: 1485, h: 984,  alpha: 'premultiplied', present: true },
  { name: 'slint 尺寸(1605x1984)',      w: 1605, h: 1984, alpha: 'premultiplied', present: true },
  { name: '+CSS 1.25x 缩放',            w: 1605, h: 1984, cssW: 1284, cssH: 1587, alpha: 'premultiplied', present: true },
  { name: '+alpha=opaque',              w: 1605, h: 1984, cssW: 1284, cssH: 1587, alpha: 'opaque', present: true },
  { name: '+每帧 1ms JS',               w: 1605, h: 1984, cssW: 1284, cssH: 1587, alpha: 'opaque', present: true, busyMs: 1 },
  { name: 'opaque 单独(base 尺寸)',     w: 1485, h: 984,  alpha: 'opaque', present: true },
  { name: '不呈现只 rAF(对照)',         w: 1605, h: 1984, alpha: 'opaque', present: false },
];

document.getElementById('sweep').onclick = async () => {
  if (!await initGpu()) return;
  out.textContent = '';
  for (const cfg of CASES) await runCase(cfg);
  log('--- 扫描完成');
};
</script>
